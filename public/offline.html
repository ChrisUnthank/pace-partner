<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Strider — Offline</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: #111312;
    color: #f2f0ea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Manrope, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
  }
  .card { max-width: 360px; text-align: center; }
  .mark {
    width: 56px; height: 56px; margin: 0 auto 20px;
    border-radius: 14px;
    background: #FF004C;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 24px -4px rgba(255,0,76,0.6);
  }
  .mark svg { width: 28px; height: 28px; }
  h1 { font-size: 19px; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.01em; }
  p { font-size: 14px; line-height: 1.5; color: #9c9890; margin: 0 0 24px; }
  button {
    font: inherit; font-weight: 600; font-size: 14px;
    background: #FF004C; color: #fff; border: none;
    padding: 10px 20px; border-radius: 8px; cursor: pointer;
  }
  button:active { opacity: 0.85; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="#fff"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>
      Strider can't reach the network right now. Once you're back online, this
      page will reconnect automatically — or tap below to try again.
    </p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
